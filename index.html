<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b2314">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="icon" href="/icon-192.png">
<script>if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})});</script>
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}.gal button img,.fig img,.lbi img{display:block;width:100%;height:auto;max-height:70vh;object-fit:cover}
</style>
<title>Guia da Mostra Bíblica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: guia da mostra com páginas lado a lado (pager nativo com snap): arrastar acompanha o dedo, trilha e barra inferior animam junto.  Trilha de 5 estandes no cabeçalho, capa grande por estande, abas (resumo, galeria, curiosidades, desafio), quiz de 3 perguntas com parabéns, barra inferior (anterior, estandes, próximo) com lista de estandes, final com o app em um celular */
:root{--bg:#efe4cc;--card:#f8f1e0;--ink:#3b2314;--mut:#66523c;--line:#d3c19d;--ac:#523119;--on:#f9f1df;--gold:#8f5a22;--hero:#5e3b22;--heroink:#fff3dc;--cta:#dfac66;--ctaink:#2a1a10;--nav:#f8f1e0;--stamp:#8c2f1b;--ok:#2e7d32;--bad:#b3261e;--fs:1;--ff:Georgia,"Times New Roman",serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f140d;--card:#2b1d13;--ink:#f0e2c8;--mut:#b49c7c;--line:#4a3523;--ac:#d9a866;--on:#2a1a10;--gold:#d9a866;--hero:#120a05;--nav:#2b1d13;--stamp:#e0705a;--ok:#7fcf84;--bad:#f2a199;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f140d;--card:#2b1d13;--ink:#f0e2c8;--mut:#b49c7c;--line:#4a3523;--ac:#d9a866;--on:#2a1a10;--gold:#d9a866;--hero:#120a05;--nav:#2b1d13;--stamp:#e0705a;--ok:#7fcf84;--bad:#f2a199;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:calc(17px*var(--fs))/1.6 var(--ff);padding-block:0;display:flex;flex-direction:column;overflow:hidden}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:var(--ff);color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
.k{font:italic 600 15px var(--ff);color:var(--gold);margin:0 0 6px}
.mut{color:var(--mut);font-size:15px;line-height:1.5}
/* cabeçalho com trilha */
.hd{flex:none;background:var(--bg);border-bottom:1px solid var(--line);padding-block:8px 10px;position:relative;z-index:5}
.hd .in{max-width:560px;margin:0 auto}
.l1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ht{font:700 14px/1.2 var(--ff);min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ht small{display:block;font:italic 600 12.5px var(--ff);color:var(--gold)}
.th{display:grid;place-items:center;margin-left:8px;width:40px;height:36px;padding:0;color:var(--ink);cursor:pointer}.th .ic{width:20px;height:20px}
.hb{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 11px;font:600 14px var(--ff);text-decoration:none;color:var(--ink);flex:none}
.trail{position:relative;display:flex;justify-content:space-between;align-items:center;margin:10px 2px 2px}
.trail .ln{position:absolute;left:13px;right:13px;top:50%;height:3px;margin-top:-1.5px;background:var(--line);border-radius:2px}
.trail .fl{position:absolute;left:13px;top:50%;height:3px;margin-top:-1.5px;background:var(--gold);border-radius:2px;width:0}
.trail a{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;font:700 12px var(--ff);color:var(--mut);text-decoration:none;position:relative;z-index:1;will-change:transform}
.trail a.v{border-color:var(--gold);background:var(--gold);color:var(--on)}
.trail a.on{border-color:var(--ac);background:var(--ac);color:var(--on);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 30%,transparent)}
.ht{animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;position:relative}
.pager::-webkit-scrollbar{display:none}
.pane{flex:0 0 100%;width:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
.pane .in{max-width:560px;margin:0 auto;padding-block:16px 40px}
.swh{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(30,18,10,.9);color:#f3e8d3;border-radius:22px;padding:9px 16px;font:600 14px var(--ff);pointer-events:none;z-index:6;animation:hint 1.6s ease-in-out infinite;white-space:nowrap}
@keyframes hint{0%,100%{transform:translateX(-50%)}50%{transform:translateX(calc(-50% + 10px))}}
.swh.off{display:none}
/* capa */
.cover{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3.4;background:#2a1a10}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,10,4,.92) 5%,rgba(20,10,4,.25) 55%,rgba(20,10,4,.05))}
.cover .cn{position:absolute;right:14px;top:4px;z-index:2;font:italic 700 96px/1 var(--ff);color:rgba(240,223,192,.5)}
.cover .ct{position:absolute;left:16px;right:16px;bottom:14px;z-index:2;color:#f6ead3}
.cover .ct small{display:block;font:italic 600 14px var(--ff);color:#d9a866;margin-bottom:4px}
.cover .ct h2{font-size:27px}
.img-credit{margin:6px 2px 10px;font:italic 12px/1.4 system-ui,sans-serif;color:var(--mut)}.img-credit a{color:var(--gold);text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 13px;font:600 14px var(--ff);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
button.chip{cursor:pointer}
button.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
/* abas */
.tabs{position:sticky;top:0;z-index:20;background:var(--bg);display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:10px 0;margin-top:6px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{min-width:0;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:10px 0;font:600 13px var(--ff);min-height:44px}
.tabs button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.txt{font-size:calc(19px*var(--fs));line-height:1.7;margin:0 0 14px}
.lead{font-size:calc(22px*var(--fs));line-height:1.55;margin:4px 0 16px;font-style:italic}
.ph{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block;margin:6px 0 14px}
.quote{border-left:3px solid var(--gold);padding:2px 0 2px 14px;margin:18px 0;font:italic calc(20px*var(--fs))/1.55 var(--ff)}
/* galeria */
.lb{position:fixed;inset:0;z-index:60;background:rgba(40,26,14,.94);display:flex;flex-direction:column;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.lb p{color:#f0dfc0;text-align:center;margin:12px 0 0}
.lb .rw{display:flex;gap:10px;margin-top:16px}
.lb button{flex:1;min-height:48px;border:1px solid #a8743a;background:none;color:#f0dfc0;border-radius:6px;font:600 16px var(--ff)}
/* curiosidades */
.flip{perspective:900px;display:block;width:100%;border:0;background:none;padding:0;margin:0 0 12px;height:150px}
.flip .fi{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;padding:16px 18px;text-align:left}
.flip .f{background:var(--hero);color:#f0dfc0;border:1px solid #a8743a}
.flip .f b{font:italic 700 22px var(--ff)}.flip .f small{color:#d9a866;font-size:14px;margin-top:4px}
.flip .b{background:var(--card);border:1px solid var(--gold);transform:rotateY(180deg);font-size:calc(18px*var(--fs))}
/* desafio */
.qz{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:18px}
.qz h3{font-size:22px;margin-bottom:14px}
.op{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:13px 14px;margin:8px 0;font-size:calc(18px*var(--fs));min-height:54px}
.op b{width:30px;height:30px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;flex:none;font-size:14px;color:var(--gold)}
.op.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--bg))}
.op.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
/* próximo */
.next{display:flex;align-items:center;gap:14px;border:1px solid var(--gold);border-radius:8px;padding:14px 16px;margin-top:22px;text-decoration:none;color:var(--ink);background:var(--card)}
.next .n{width:46px;height:46px;border-radius:6px;background:var(--ac);color:var(--on);display:grid;place-items:center;font:700 22px var(--ff);flex:none}
.next span{flex:1;min-width:0}.next b{display:block;font-size:18px}.next small{color:var(--mut);font-size:13.5px}.next i{font-style:normal;font-size:28px;color:var(--gold)}
.hint{text-align:center;color:var(--mut);font-size:13px;margin:14px 0 0}
/* início */
.hero{background:var(--hero);color:#f0dfc0;border-radius:8px;border:1px solid #a8743a;padding:22px 20px;position:relative;overflow:hidden}
.hero .k{color:#d9a866}.hero h1{font-size:34px}.hero p{margin:10px 0 0;color:#e2cfae}
.btn{min-height:54px;border:0;border-radius:8px;background:var(--cta);color:var(--ctaink);font:700 18px var(--ff);display:flex;align-items:center;justify-content:center;padding:12px;text-decoration:none;width:100%;margin-top:16px}
.btn.alt{background:none;color:inherit;border:1px solid var(--line)}
.route{position:relative;margin:8px 0 0}
.route::before{content:"";position:absolute;left:22px;top:30px;bottom:30px;width:3px;background:repeating-linear-gradient(to bottom,var(--line) 0 8px,transparent 8px 14px)}
.route a,.route .rt{position:relative;display:flex;align-items:center;gap:14px;padding:11px 0;text-decoration:none;color:var(--ink)}
.route .n{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);background:var(--bg);display:grid;place-items:center;font:700 20px var(--ff);color:var(--mut);flex:none;position:relative;z-index:1}
.route .v .n{background:var(--gold);border-color:var(--gold);color:var(--on)}
.route .nx .n{border-color:var(--ac);color:var(--ink);box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 28%,transparent)}
.route .bx{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 14px}
.route .nx .bx{border-color:var(--gold)}
.route b{display:block;font-size:18px}.route small{color:var(--mut);font-size:13.5px}
/* final */
.fin{background:var(--hero);color:#f0dfc0;border-radius:10px;border:1px solid #a8743a;padding:26px 20px 24px;position:relative;overflow:hidden}
.fin .k{color:#d9a866}.fin h2{font-size:30px}.fin>p{margin:12px 0 0;color:#e2cfae}
.phone{width:min(62%,250px);margin:22px auto 6px;border:6px solid #120a05;border-radius:30px;background:#120a05;box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 0 2px #a8743a;transform:rotate(-3deg);overflow:hidden}
.phone img{display:block;width:100%;border-radius:24px}
.ben{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:9px}
.ben li{display:flex;gap:10px;align-items:flex-start;font-size:16.5px;line-height:1.4}
.ben li::before{content:"";width:9px;height:9px;border-radius:50%;background:#d9a866;margin-top:7px;flex:none}
.fin .btn{font-size:20px;min-height:60px;animation:pl 2.4s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(217,168,102,.55)}60%{box-shadow:0 0 0 14px rgba(217,168,102,0)}}
.guide{margin-top:16px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:16px}
.guide ol{margin:8px 0 0;padding-left:20px}.guide li{margin:6px 0;font-size:16px}
.cf{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cf i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 3.2s linear forwards}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}
/* barra inferior */
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chip.dk{background:rgba(240,223,192,.1);border-color:#a8743a;color:#f0dfc0}
.orn{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--gold)}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:var(--line)}
.rays{position:absolute;inset:-20% -20%;background:repeating-conic-gradient(from 0deg at 50% 55%,rgba(217,168,102,.09) 0 5deg,transparent 5deg 10deg);pointer-events:none;mask-image:radial-gradient(circle at 50% 55%,#000 15%,transparent 70%);-webkit-mask-image:radial-gradient(circle at 50% 55%,#000 15%,transparent 70%)}
.qd{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.qd i{width:34px;height:6px;border-radius:3px;background:var(--line)}.qd i.c{background:color-mix(in srgb,var(--gold) 55%,var(--line))}.qd i.d{background:var(--gold)}
.qd span{margin-left:auto;font-size:13px;color:var(--mut)}
.op:disabled{opacity:1}
.op.bad{opacity:.75}
.op.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.op.ok b{background:var(--ok);border-color:var(--ok);color:#fff}
.fb{display:flex;align-items:center;gap:14px;margin:14px 0 4px}
.fb p{margin:2px 0 0;color:var(--mut);font-size:15px}.fb b{font-size:21px}
.fb.good b{color:var(--ok)}.fb.bad2 b{color:var(--bad)}.fb.bad2 .wb{background:var(--bad)}.op.bad b{background:var(--bad);border-color:var(--bad);color:#fff}
p.fb.bad{display:block;margin:12px 0 0;color:var(--bad);font-size:16px}p.fb.bad b{font-size:inherit;color:inherit}
.fb .btn,.qz .btn{margin-top:12px}
.wc{position:relative;width:76px;height:76px;margin:6px auto 12px}
.wc.sm{width:54px;height:54px;margin:0;flex:none}
.wb{position:absolute;inset:0;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;animation:pp .55s cubic-bezier(.2,1.6,.4,1) both}
.wb .ic{width:46%;height:46%;stroke-width:3}
@keyframes pp{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.burst{position:absolute;left:50%;top:50%;width:0;height:0}
.burst i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:2px;background:var(--c);animation:bst .9s ease-out .1s both}
@keyframes bst{from{transform:rotate(var(--a)) translateY(-20px);opacity:1}to{transform:rotate(var(--a)) translateY(-78px) scale(.5);opacity:0}}
.qz.win{text-align:center}
.qz.win .btn{width:100%}
.bb{flex:none;position:relative;z-index:5;background:var(--nav);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center}
.bb .pr{position:absolute;top:-1px;left:0;height:3px;background:var(--gold);width:0}
.bb button{font-family:var(--ff);border:0;cursor:pointer}
.bb .pv{width:54px;height:54px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center}
.bb .pv .ic{width:24px;height:24px}
.bb .pv:disabled{opacity:.3}
.bb .mid{background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 2px;min-width:0}
.bb .mid span:first-child{font:700 15px var(--ff);display:flex;align-items:center;gap:6px;white-space:nowrap}
.bb .dts{display:flex;gap:6px}
.bb .dts i{width:16px;height:5px;border-radius:3px;background:var(--line);transition:width .25s,background .25s}
.bb .dts i.v{background:color-mix(in srgb,var(--gold) 60%,var(--line))}
.bb .dts i.on{background:var(--ac);width:30px}
.bb .nx{height:54px;border-radius:14px;background:var(--ac);color:var(--on);padding:0 20px;font:700 17px var(--ff);display:flex;align-items:center;gap:6px;min-width:128px;justify-content:center}
.bb .nx .ic{width:22px;height:22px;stroke-width:2.6}
.bb .nx.fin5{background:var(--gold);color:var(--on)}
.sh{position:fixed;inset:0;z-index:60;background:rgba(40,26,14,.4);display:flex;align-items:flex-end;animation:fd .2s}
.sp{width:100%;max-width:560px;margin:0 auto;background:var(--bg);border-radius:18px 18px 0 0;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));max-height:84vh;overflow:auto;animation:up .25s ease-out;border:1px solid var(--line)}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sp button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:none;padding:8px 4px;border-bottom:1px solid var(--line);color:var(--ink);font-family:var(--ff);min-height:58px;cursor:pointer}
.sp button:last-child{border:0}
.sp .sn{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 18px var(--ff);color:var(--mut);flex:none}
.sp .sn .ic{width:20px;height:20px}
.sp button.on .sn{background:var(--ac);border-color:var(--ac);color:var(--on)}
.sp b{display:block;font-size:18px}.sp small{color:var(--mut);font-size:13.5px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}@keyframes fd{from{opacity:0}to{opacity:1}}
.cover svg{width:100%;height:100%;display:block}
.hh{font:700 calc(21px*var(--fs)) var(--ff);color:var(--gold);margin:22px 0 6px}
.fig{margin:6px 0 16px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}.fig svg{display:block;width:100%;height:auto}.fig figcaption{padding:8px 12px;font:italic 14px var(--ff);color:var(--mut)}
.gal{display:grid;grid-template-columns:1fr;gap:12px}
.gal button{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card);text-align:left}
.gal button svg{display:block;width:100%;height:auto}
.gal span{display:block;padding:8px 12px;font:italic 14.5px var(--ff);color:var(--ink)}
.gal .fig{margin:0}.gal .gal-photo{display:block;width:100%;padding:0;border:0;background:transparent;text-align:left;cursor:zoom-in}.gal .gal-photo img{display:block;width:100%;height:auto;max-height:70vh;object-fit:cover}.gal .gal-photo span{display:block;padding:8px 12px;font:italic 14.5px var(--ff);color:var(--ink)}.gal .fig figcaption{font:italic 12px/1.4 system-ui,sans-serif}.gal .fig figcaption a{color:var(--gold)}.lbi img{display:block;width:100%;height:auto;max-height:68vh;object-fit:contain}
.lbi{border-radius:6px;overflow:hidden}.lbi svg{display:block;width:100%;height:auto;max-height:68vh}
.quote .qb{display:block;margin-top:6px;font:600 14px var(--ff);color:var(--mut);font-style:normal}
.flip{height:200px}.flip .b{overflow:auto}
</style>
</head>
<body>

const BIBLIA="biblia/#instalar";
const N=5,QN=3;
const P={bg:'#f3e6c8',ink:'#3b2314',gold:'#c98f3f',deep:'#6b4429',red:'#8c2f1b',grn:'#4b6b4a',blu:'#3f5f7f',cr:'#fbf3df',pap:'#e6d2a4',dk:'#2a1a10'};
const T=(x,y,s,o={})=>`<text x="${x}" y="${y}" font-family="Georgia,'Times New Roman',serif" font-size="${o.s||14}" fill="${o.f||P.ink}" text-anchor="${o.a||'middle'}" font-weight="${o.w||400}"${o.i?' font-style="italic"':''}${o.r?` transform="rotate(${o.r} ${x} ${y})"`:''}>${s}</text>`;
const SV=(vb,body,bg,sl)=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" role="img" preserveAspectRatio="xMidYMid ${sl?'slice':'meet'}"><rect width="100%" height="100%" fill="${bg||P.bg}"/>${body}</svg>`;
const G=b=>SV('0 0 400 250',b);
const R=(x,y,w,h,f,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.r||0}" fill="${f}"${o.s?` stroke="${o.s}" stroke-width="${o.sw||1.5}"`:''}${o.op?` opacity="${o.op}"`:''}/>`;
const C=(x,y,r,f,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"${o.s?` stroke="${o.s}" stroke-width="${o.sw||1.5}"`:''}/>`;
const L=(x1,y1,x2,y2,c,w,d)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c||P.ink}" stroke-width="${w||2}" stroke-linecap="round"${d?` stroke-dasharray="${d}"`:''}/>`;
const PA=(d,f,s,w)=>`<path d="${d}" fill="${f||'none'}"${s?` stroke="${s}" stroke-width="${w||2}" stroke-linecap="round" stroke-linejoin="round"`:''}/>`;
const lines=(x,y,w,n,gap,c)=>Array.from({length:n},(_,i)=>L(x,y+i*gap,x+w-(i%3===2?w*.3:0),y+i*gap,c||P.deep,1.6)).join('');
const openBook=(cx,cy,w,h,f,s)=>PA(`M${cx} ${cy+6}Q${cx-w*.25} ${cy-h*.12} ${cx-w/2} ${cy}V${cy+h*.8}Q${cx-w*.25} ${cy+h*.7} ${cx} ${cy+h*.85}Z`,f,s,2.2)+PA(`M${cx} ${cy+6}Q${cx+w*.25} ${cy-h*.12} ${cx+w/2} ${cy}V${cy+h*.8}Q${cx+w*.25} ${cy+h*.7} ${cx} ${cy+h*.85}Z`,f,s,2.2)+lines(cx-w*.43,cy+h*.18,w*.36,5,h*.11)+lines(cx+w*.07,cy+h*.18,w*.36,5,h*.11);

<a class="next" href="#${ROUTE[n+1]}" data-go="${n+1}"><div class="n">${nx?nx.n:ic("down")}</div><span><small>${nx?"Próximo estande":"Fim dos estandes"}</small><b>${nx?nx.t:"Ver o convite do aplicativo"}</b></span><i>›</i></a></div>`;
}
const QD=[[{"q": "Por que Jerônimo decidiu traduzir a Bíblia?", "o": ["Porque não existia nenhuma versão em latim", "Porque as versões em latim tinham erros e diferenças", "Porque queria escrever um livro novo"], "c": 1, "e": "Havia versões em latim com erros e diferenças, e ele queria uma tradução mais fiel aos originais."}, {"q": "Quem deu a Jerônimo a missão de traduzir?", "o": ["O papa Dâmaso", "Lutero", "Michelangelo"], "c": 0, "e": "A missão veio do papa Dâmaso. Para cumpri-la, Jerônimo estudou hebraico e grego."}, {"q": "Por que São Jerônimo é representado com um leão?", "o": ["Porque o leão era o símbolo de Roma", "Porque, segundo a lenda, ele tirou um espinho da pata de um leão, que ficou ao seu lado", "Porque viveu num zoológico"], "c": 1, "e": "Pela antiga lenda do leão com o espinho na pata, que se tornou seu companheiro."}], [{"q": "O que eram as cartas do Novo Testamento?", "o": ["Tratados teóricos distantes", "Correspondências reais enviadas a cidades do Império Romano", "Poemas cantados nas igrejas"], "c": 1, "e": "Eram cartas reais a cidades como Corinto, Roma e Éfeso, que enfrentavam crises e dúvidas."}, {"q": "Como Paulo usava a escrita em suas cartas?", "o": ["Como um abraço à distância e uma bronca afetuosa", "Só para contar a vida de Jesus", "Apenas para dar ordens"], "c": 0, "e": "Paulo unia profunda teologia a conselhos práticos sobre amor, paciência e convivência."}, {"q": "O que a parábola do Bom Samaritano ensina?", "o": ["Que só os parentes merecem ajuda", "Que é melhor evitar estranhos", "Que o próximo é quem age com compaixão"], "c": 2, "e": "Ela desafia preconceitos e mostra que o próximo é quem age com compaixão."}], [{"q": "Quantos livros tem a Bíblia católica?", "o": ["66", "73 (46 no Antigo e 27 no Novo Testamento)", "81"], "c": 1, "e": "A católica tem 73 livros: 46 no Antigo Testamento e 27 no Novo."}, {"q": "Quantos livros costumam ter a Bíblia evangélica e a protestante?", "o": ["73", "72", "66 (39 no Antigo e 27 no Novo Testamento)"], "c": 2, "e": "Elas geralmente têm 66 livros: 39 no Antigo Testamento e 27 no Novo."}, {"q": "Conhecer as variações entre as tradições bíblicas nos ajuda a...", "o": ["Compreender a diversidade do cristianismo e respeitar as diferentes crenças", "Descobrir qual tradição está certa", "Evitar ler outras Bíblias"], "c": 0, "e": "Conhecer as variações nos ajuda a compreender a diversidade e a respeitar as diferentes crenças."}], [{"q": "Em quantas partes principais a Bíblia é dividida?", "o": ["Duas: Antigo e Novo Testamento", "Três", "Cinco"], "c": 0, "e": "A Bíblia tem duas partes: o Antigo e o Novo Testamento."}, {"q": "Quais são alguns dos grupos de livros da Bíblia?", "o": ["Apenas leis e cartas", "Históricos, poéticos, proféticos e Evangelhos", "Somente poemas e profecias"], "c": 1, "e": "Há livros históricos, poéticos, proféticos e os Evangelhos."}, {"q": "Por que a Bíblia católica tem 73 livros e a protestante 66?", "o": ["Por um erro de impressão", "Porque uma foi escrita depois da outra", "Por causa das diferenças entre suas tradições"], "c": 2, "e": "A diferença vem das tradições de cada Igreja."}], [{"q": "Onde fica a Capela Sistina e a que arte ela pertence?", "o": ["Em Paris, arte barroca", "No Vaticano, arte renascentista", "Em Florença, arte gótica"], "c": 1, "e": "Fica no Vaticano e é um dos maiores exemplos da arte renascentista, com realismo, profundidade e proporção."}, {"q": "Qual pintura mostra Jesus entregando as chaves do Reino dos Céus a Pedro?", "o": ["A Queda do Homem", "A Santa Ceia", "A Entrega das Chaves"], "c": 2, "e": "A Entrega das Chaves representa a autoridade de Pedro na Igreja."}, {"q": "O que a pintura A Criação de Adão mostra?", "o": ["Deus dando vida a Adão", "Adão e Eva desobedecendo", "Jesus e os doze discípulos"], "c": 0, "e": "Ela simboliza a ligação entre Deus e a humanidade."}]];
const QZ=n=>QD[n-1];
const OKS=["Parabéns!","Muito bem!","Isso mesmo!"],COL=["#d9a866","#e0705a","#7fcf84","#f0dfc0"];
const burst=()=>`<span class="burst" aria-hidden="true">${[...Array(14)].map((_,k)=>`<i style="--a:${k*(360/14)}deg;--c:${COL[k%4]}"></i>`).join("")}</span>`;
function quiz(n){
  const q=qs[n]||(qs[n]={i:0,ok:false,a:null,done:false}),Q=QZ(n);
  if(q.done)return `<div class="qz win"><div class="wc">${burst()}<span class="wb">${ic("check")}</span></div><h3>Quiz concluído!</h3><p class="mut" style="margin:6px 0 16px">Você terminou as 3 perguntas do estande ${n}.</p>${n<N?`<a class="btn" href="#estande-${n+1}" data-go="${n+1}">Ir para o estande ${n+1}</a>`:`<a class="btn" href="#baixar" data-go="6">Ver o convite do aplicativo</a>`}<button class="btn alt" data-qr="1" style="margin-top:10px">Refazer o quiz</button></div>`;
  const it=Q[q.i];
  return `<div class="qz"><p class="k" style="margin:0 0 8px">Quiz do estande ${n}</p><div class="qd" aria-label="Pergunta ${q.i+1} de ${QN}">${[0,1,2].map(k=>`<i class="${k<q.i||(k===q.i&&q.a!=null)?"d":k===q.i?"c":""}"></i>`).join("")}<span>${q.i+1} de ${QN}</span></div><h3>${it.q}</h3>${it.o.map((o,k)=>{const an=q.a!=null,good=an&&k===it.c,bad=an&&k===q.a&&k!==it.c;return `<button class="op${good?" ok":bad?" bad":""}${bad?" shake":""}" data-o="${k}" ${an?"disabled":""}><b>${good?ic("check"):bad?ic("x"):"ABC"[k]}</b>${o}</button>`}).join("")}${q.a!=null?`<div class="fb ${q.ok?"good":"bad2"}"><div class="wc sm">${q.ok?burst():""}<span class="wb">${ic(q.ok?"check":"x")}</span></div><div><b>${q.ok?OKS[q.i]:"Não foi dessa vez"}</b><p>${q.ok?"":"A resposta certa está destacada em verde. "}${it.e}</p></div></div><button class="btn" data-qn="1">${q.i<QN-1?"Próxima pergunta":"Concluir o quiz"}</button>`:`<p class="mut" style="margin:10px 0 0">Escolha uma resposta.</p>`}</div>`;
}
function content(n){
  const el=pane(n).querySelector(".tc"),tab=tabs[n]||"r";let h="";
  const D=DATA[n-1];
  if(tab==="r")h=`<p class="lead">${D.lead}</p>`+D.secs.map((x,k)=>`<h3 class="hh">${x.h}</h3><p class="txt">${x.p}</p>`+(k===0?`<figure class="fig" data-i="0">${D.gal[0].svg}<figcaption>${D.gal[0].cap}</figcaption></figure>`:"")).join("")+`<div class="orn">${ic("cross")}</div><div class="quote">${D.quote.t}<small class="qb">${D.quote.by}</small></div>`;
  else if(tab==="g")h=`<div class="gal">${D.gal.map((g,k)=>`<figure class="fig"><button class="gal-photo" data-i="${k}" aria-label="Ampliar: ${g.cap}">${g.svg}<span>${g.cap}</span></button><figcaption>Fonte: <a href="${g.page}" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a> · ${g.credit}</figcaption></figure>`).join("")}</div><p class="mut" style="margin-top:10px">Toque em uma imagem para ampliar.</p>`;
  else if(tab==="c")h=`<p class="mut" style="margin:0 0 12px">Toque nos cartões para virar.</p>`+D.curios.map(c=>`<button class="flip" data-f="1"><div class="fi"><div class="f">${ic("bulb")}<b>${c.f}</b><small>Toque para revelar</small></div><div class="b">${c.b}</div></div></button>`).join("");
  else h=quiz(n);
  el.innerHTML=h;
}
function end(){
  return `<div class="in pad"><div class="fin"><div class="cf" id="cf"></div><div class="rays"></div><p class="k" style="position:relative">Fim da mostra</p><h2 style="position:relative">Obrigado pela visita</h2><p style="position:relative">Leve a Bíblia com você: o aplicativo funciona no seu celular, sem precisar procurar na loja.</p>
<div class="phone"><img src="${APP}" alt="Tela inicial do aplicativo Bíblia Sagrada"></div>
<ul class="ben"><li>Bíblia completa para ler, com áudio em voz alta</li><li>Versículo do dia com reflexão</li><li>Planos de leitura, memorização e quiz</li><li>Meditação, orações e diário, tudo no seu aparelho</li></ul>
<a class="btn" id="inst" href="${BIBLIA}">Instalar o aplicativo da Bíblia</a></div>
</div>`;
}
/* ---- estrutura ---- */
function build(){
  pg.innerHTML=ROUTE.map((r,i)=>`<section class="pane" data-p="${i}" aria-label="${i===0?"Início":i===6?"Aplicativo":"Estande "+i}"></section>`).join("")+`<div class="swh${swiped?" off":""}" id="swh">Arraste para o lado ›</div>`;
  pane(0).innerHTML=home();for(let n=1;n<=N;n++){pane(n).innerHTML=stand(n);content(n)}pane(6).innerHTML=end();
  $("#tr").insertAdjacentHTML("beforeend",ST.map(x=>`<a href="#estande-${x.n}" data-go="${x.n}" aria-label="Estande ${x.n}" id="t${x.n}">${x.n}</a>`).join(""));
}
function go(i,instant){pg.scrollTo({left:clamp(i,0,6)*pg.clientWidth,behavior:instant||reduce?"auto":"smooth"})}
function paint(){
  const c=cur;
  for(let n=1;n<=N;n++)$("#t"+n).className=c===n?"on":seen.includes(n)?"v":"";
  $("#hb").style.display=c===0?"none":"";
  const ht=$("#ht"),nh=c===0?"Mostra Bíblia Sagrada":c===6?"Aplicativo da Bíblia":`<small>Estande ${c} de ${N}</small>${ST[c-1].t}`;
  if(ht.dataset.k!==String(c)){ht.dataset.k=c;ht.innerHTML=nh;ht.style.animation="none";ht.offsetWidth;ht.style.animation=""}
  $("#pv").disabled=c<=0;
  $("#ml").textContent=c===0?"Início":c===6?"Aplicativo":"Estande "+c+" de "+N;
  $("#dts").innerHTML=ST.map(x=>`<i class="${c===x.n?"on":seen.includes(x.n)?"v":""}"></i>`).join("");
  const nx=$("#nx");nx.dataset.to=c>=6?0:c+1;nx.innerHTML=(c===0?"Começar":c===5?"Finalizar":c===6?"Início":"Próximo")+(c===6?"":" "+ic("right"));
  nx.classList.toggle("fin5",c===5);
}
function frame(){
  const p=pg.scrollLeft/(pg.clientWidth||1);
  $("#fl").style.width=(clamp(p-1,0,4)/4)*($("#tr").clientWidth-30)+"px";
  for(let n=1;n<=N;n++)$("#t"+n).style.transform="scale("+(1+.3*Math.max(0,1-Math.abs(p-n)))+")";
  $("#pr").style.width=(clamp(p,0,6)/6*100)+"%";
}
let raf=0,settle=0;
pg.addEventListener("scroll",()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;frame()});clearTimeout(settle);settle=setTimeout(onSettle,90);if(!swiped&&pg.scrollLeft>20){swiped=true;lsS("mostra-deslizou",true);$("#swh").classList.add("off")}},{passive:true});
function onSettle(){
  const i=Math.round(pg.scrollLeft/(pg.clientWidth||1));if(i===cur)return;
  const prev=cur;cur=i;
  if(i>=1&&i<=5&&!seen.includes(i)){seen.push(i);lsS("mostra-vistos",seen);pane(0).innerHTML=home()}
  if(i===0)pane(0).innerHTML=home();
  if(i===6)confete();
  try{history.replaceState(null,"","#"+ROUTE[i])}catch(e){}
  try{if(prev>=0&&navigator.vibrate)navigator.vibrate(8)}catch(e){}
  paint();
}
function confete(){
  if(seen.length<N||lsG("mostra-festa",false))return;lsS("mostra-festa",true);
  const f=$("#cf");if(!f)return;
  for(let i=0;i<28;i++){const s=document.createElement("i");s.style.left=Math.random()*100+"%";s.style.background=COL[i%4];s.style.animationDelay=Math.random()*.9+"s";f.appendChild(s)}
}
function lightbox(i){
  const L=document.createElement("div");L.className="lb";let k=i;const g=DATA[Math.max(1,cur)-1].gal;
  const draw=()=>{L.innerHTML=`<div class="lbi">${g[k].svg}</div><p>${g[k].cap} (${k+1} de ${g.length})</p><p><a href="${g[k].page}" target="_blank" rel="noopener noreferrer" style="color:#d9a866">Ver origem e licença da imagem</a></p><div class="rw"><button data-d="-1">‹</button><button data-d="0">Fechar</button><button data-d="1">›</button></div>`};
  draw();L.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=+b.dataset.d;if(d===0)L.remove();else{k=(k+d+g.length)%g.length;draw()}});document.body.appendChild(L);
}
function sheet(){
  const L=document.createElement("div");L.className="sh";
  L.innerHTML=`<div class="sp" role="dialog" aria-label="Ir para"><div class="grab"></div><p class="k" style="margin:0 0 4px">Ir para</p>${[0,1,2,3,4,5,6].map(i=>`<button data-to="${i}" class="${i===cur?"on":""}"><span class="sn">${i===0?ic("home"):i===6?ic("down"):i}</span><span><b>${i===0?"Início":i===6?"Aplicativo da Bíblia":ST[i-1].t}</b><small>${i===cur?"Você está aqui":i>=1&&i<=5?(seen.includes(i)?"Já visitado":ST[i-1].sub):i===0?"Menu da mostra":"Convite final"}</small></span></button>`).join("")}</div>`;
  L.addEventListener("click",e=>{const b=e.target.closest("[data-to]");if(b){L.remove();go(+b.dataset.to);return}if(e.target===L)L.remove()});
  document.body.appendChild(L);
}
document.addEventListener("click",e=>{
  if(e.target.closest("#pv")){go(cur-1);return}
  if(e.target.closest("#nx")){go(+$("#nx").dataset.to);return}
  if(e.target.closest("#md")){sheet();return}
  const g=e.target.closest("[data-go]");if(g&&!e.target.closest(".lb")){e.preventDefault();go(+g.dataset.go);return}
  const ps=e.target.closest(".pane");if(!ps)return;const n=+ps.dataset.p;
  const t=e.target.closest("[data-t]");
  if(t){tabs[n]=t.dataset.t;ps.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b===t));content(n);return}
  const gi=e.target.closest("[data-i]");if(gi){lightbox(+gi.dataset.i);return}
  const f=e.target.closest("[data-f]");if(f){f.classList.toggle("on");return}
  const show=()=>{content(n);const x=ps.querySelector(".fb,.win");if(x)x.scrollIntoView({block:"center",behavior:reduce?"auto":"smooth"})};
  const o=e.target.closest("[data-o]");
  if(o){const q=qs[n];if(!q||q.a!=null)return;const k=+o.dataset.o;q.a=k;q.ok=k===QZ(n)[q.i].c;try{navigator.vibrate&&navigator.vibrate(q.ok?[12,40,12]:[30])}catch(x){}show();return}
  if(e.target.closest("[data-qn]")){const q=qs[n];if(q.i<QN-1){q.i++;q.ok=false;q.a=null}else q.done=true;content(n);const tb=ps.querySelector(".tabs");if(tb)ps.scrollTo({top:tb.offsetTop-6,behavior:reduce?"auto":"smooth"});return}
  if(e.target.closest("[data-qr]")){qs[n]=null;content(n);return}
  const fz=e.target.closest("[data-fs]");
  if(fz){fs=Math.round(clamp(fs+.1*(+fz.dataset.fs),.85,1.35)*100)/100;document.documentElement.style.setProperty("--fs",fs);lsS("mostra-fonte",fs);return}
});
const SUN='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',MOON='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
const curTheme=()=>document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
function paintTheme(){const t=curTheme(),b=$("#th");if(b){b.innerHTML=t==="dark"?SUN:MOON;b.setAttribute("aria-label",t==="dark"?"Mudar para tema claro":"Mudar para tema escuro")}}
{const sv=lsG("mostra-tema",null);if(sv==="dark"||sv==="light")document.documentElement.dataset.theme=sv}
document.addEventListener("click",e=>{if(!e.target.closest("#th"))return;const t=curTheme()==="dark"?"light":"dark";document.documentElement.dataset.theme=t;lsS("mostra-tema",t);paintTheme()});
let dip=null;
const setInst=t=>{const a=$("#inst");if(a)a.textContent=t};
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dip=e});
addEventListener("appinstalled",()=>{dip=null;setInst("Aplicativo instalado")});
document.addEventListener("click",e=>{const a=e.target.closest("#inst");if(!a||!dip)return;e.preventDefault();const d=dip;dip=null;try{d.prompt();d.userChoice.then(r=>{if(r.outcome==="accepted")setInst("Instalando o aplicativo...");else dip=d})}catch(x){location.href=BIBLIA}});
addEventListener("keydown",e=>{if(document.querySelector(".lb,.sh"))return;if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1)});
addEventListener("hashchange",()=>{const i=parse();if(i!==cur)go(i)});
addEventListener("resize",()=>{pg.scrollLeft=Math.max(0,cur)*pg.clientWidth;frame()});
const rr={};
function loadReal(){DATA.forEach((D,i)=>{const n=i+1;for(let k=0;k<=5;k++){const src="img/e"+n+"-"+k+".jpg",im=new Image();im.onload=()=>{const tag='<img src="'+src+'" alt="'+(k?D.gal[k-1].cap:D.t)+'" loading="lazy">';if(k)D.gal[k-1].svg=tag;else D.cover=tag;clearTimeout(rr[n]);rr[n]=setTimeout(()=>{pane(n).innerHTML=stand(n);content(n)},80)};im.src=src}})}
build();
const first=parse();pg.scrollLeft=first*pg.clientWidth;cur=first;
if(first>=1&&first<=5&&!seen.includes(first)){seen.push(first);lsS("mostra-vistos",seen);pane(0).innerHTML=home()}
paint();paintTheme();frame();
</script>
